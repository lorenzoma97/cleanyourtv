name: Build APK (fork lorenzoma97)

# Builds the launcher with ONE fixed signing key (secret SIGNING_KEYSTORE_B64) and publishes it as the
# rolling prerelease "apk-latest", so every new build installs over the one already on the TV.
on:
  workflow_dispatch:
  push:
    branches: [casa]
    paths: ["launcher/**", "addons/**", "themes/lorenzo/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  # SHA-256 of the signing certificate (public; ~/.cleanyourtv/signing/cert-sha256.txt). The build fails if the APK
  # is signed with anything else, e.g. a throwaway debug key generated because the secret did not land.
  EXPECTED_CERT_SHA256: ae56be168b31032cdd72d20844cf4df6e3bc4511f084b4dee6bb66bc10c697b2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Fixed signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_B64" || { echo "Missing secret SIGNING_KEYSTORE_B64"; exit 1; }
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tvhome.p12"
      # The home's settings travel inside the APK (Config.BUNDLED_THEME): one source, themes/lorenzo/config.json.
      - name: Theme into the launcher
        run: |
          python3 -c 'import json,sys; json.load(open(sys.argv[1]))' themes/lorenzo/config.json
          mkdir -p launcher/app/src/main/assets
          cp themes/lorenzo/config.json launcher/app/src/main/assets/theme.json
      - name: Build launcher
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Build Casa add-on
        working-directory: addons/casa
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      # Gradle signs with whatever debug key the runner has; re-sign explicitly so the key never depends on it.
      - name: Sign and check signatures
        run: |
          signer="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          sign() {
            "$signer" sign --ks "$RUNNER_TEMP/tvhome.p12" --ks-type PKCS12 --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android --out "$2" "$1"
            "$signer" verify --print-certs "$2" | tee -a cert.txt
            "$signer" verify --print-certs "$2" | grep -qi "SHA-256 digest: $EXPECTED_CERT_SHA256" \
              || { echo "$2 not signed with the fixed key"; exit 1; }
            echo "$2: $(( $(stat -c %s "$2") / 1024 )) KB"
          }
          sign launcher/app/build/outputs/apk/release/app-release.apk tvhome-release.apk
          sign addons/casa/app/build/outputs/apk/release/app-release.apk casa-release.apk
          rm -f "$RUNNER_TEMP/tvhome.p12"
          sha256sum tvhome-release.apk casa-release.apk > SHA256SUMS
      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest tvhome-release.apk casa-release.apk SHA256SUMS cert.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "APK latest (${GITHUB_SHA::7})" \
            --notes "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA}"
